services:
  - type: web
    name: cfp-radar
    runtime: node
    plan: starter
    region: ohio
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: VENUE_HISTORY_ENABLED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
