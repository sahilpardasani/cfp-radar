name: Venue history (verified proceedings + paper metadata)

on:
  schedule:
    - cron: "37 5 * * 1" # weekly, Monday 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfp-data-pipeline
  cancel-in-progress: false

jobs:
  venue-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency advisories
        run: npm audit

      - name: Refresh exact venue-history catalog
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: npm run expand:venue-history

      - name: Refresh verified venue histories
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ vars.DATABASE_SSL || '1' }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: npm run sync:venue-history

      - name: Verify refreshed history and application build
        run: |
          npm run test:venue-history
          npm run test:security
          npm run build

      - name: Commit refreshed snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cfp-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet data/venue-history-catalog.json data/venue-history.json data/venue-history-coverage.json data/venue-history-pending.json data/venue-history-records; then
            git add data/venue-history-catalog.json data/venue-history.json data/venue-history-coverage.json data/venue-history-pending.json data/venue-history-records
            git commit -m "chore: venue history refresh ($(date -u +%Y-%m-%d))"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No venue-history changes."
          fi
