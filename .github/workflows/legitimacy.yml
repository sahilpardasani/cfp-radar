name: Refresh venue legitimacy
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: write
concurrency:
  group: cfp-data-pipeline
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dependency advisories
        run: npm audit
      - run: npm run legitimacy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - name: Commit refreshed evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cfp-legitimacy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cfps.json
          git diff --cached --quiet || git commit -m "chore: refresh venue legitimacy evidence"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
