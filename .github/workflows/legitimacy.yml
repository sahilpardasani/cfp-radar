name: Refresh venue legitimacy
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: write
concurrency:
  group: cfp-data-pipeline
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
      - run: npm ci
      - name: Audit dependency advisories
        run: npm audit
      - run: npm run legitimacy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - name: Commit refreshed evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cfp-legitimacy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cfps.json
          git diff --cached --quiet || git commit -m "chore: refresh venue legitimacy evidence"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
