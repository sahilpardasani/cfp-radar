name: Update CFP data

# Scraper only. The scheduled two-day run lives in pipeline.yml; this
# workflow is kept for running the scraper on its own, on demand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfp-data-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency advisories
        run: npm audit
      - name: Run exhaustive OpenReview scraper
        env:
          OPENREVIEW_CONCURRENCY: 16
          OPENREVIEW_FETCH_TIMEOUT_MS: 15000
          OPENREVIEW_RETRIES: 3
        run: node scripts/scrape.mjs
      - name: Commit updated data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cfp-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet data/; then
            git add data/cfps.json data/openreview-cache.json
            git commit -m "chore: refresh CFP data ($(date -u +%Y-%m-%d))"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to CFP data."
          fi
