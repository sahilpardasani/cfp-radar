name: Verify CFP deadlines

# Weekly deadline-verification pass: re-checks each venue's deadline against its
# official CFP page (LLM agent) and stamps a verification status onto data/cfps.json.
# Needs GROQ_API_KEY (or NVIDIA_API_KEY) as a repository secret.
# Scheduled runs live in pipeline.yml (every 2 days). Kept for on-demand use.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfp-data-pipeline
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen/qwen3.8-27b' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify deadlines
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/verify-deadlines.mjs
      - name: Commit verification results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cfp-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet data/cfps.json; then
            git add data/cfps.json
            git commit -m "chore: verify CFP deadlines ($(date -u +%Y-%m-%d))"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No verification changes."
          fi
